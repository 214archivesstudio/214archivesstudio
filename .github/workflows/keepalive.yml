name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트를 일시정지합니다.
# 이 사이트의 공개 페이지는 정적(data/ 빌드)이라 방문자 트래픽이 DB를 건드리지
# 않으므로, 어드민 미사용 기간이 7일을 넘기면 정지됩니다.
#
# 이 워크플로는 매일 Supabase REST API에 가벼운 쿼리를 1회 보내 활동을 발생시켜
# 정지를 막습니다. 동시에, GitHub가 "60일간 커밋 없는 레포의 스케줄 워크플로"를
# 자동 비활성화하는 문제를 막기 위해 주 1회 heartbeat 커밋을 남깁니다.
#
# 전제: 프로젝트가 현재 일시정지 상태라면 먼저 Supabase 대시보드에서 수동
# resume 해야 이 핑이 닿습니다. 이후부터 재정지를 예방합니다.
on:
  schedule:
    # 매일 04:23 UTC (13:23 KST). 정시(:00)는 GH 부하 피크라 누락 위험 → 오프피크 분.
    - cron: "23 4 * * *"
  workflow_dispatch: # resume 직후 수동 테스트용

# keep-alive 실행이 겹치지 않도록 직렬화 (heartbeat 커밋 push 경쟁 방지).
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write # heartbeat 커밋 push 용
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Ping Supabase REST (실제 Postgres 쿼리 실행 = 활동)
        run: |
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/posts?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "Supabase keep-alive ping → HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Keep-alive ping 실패 (HTTP $HTTP). 프로젝트가 정지됐거나 키/테이블이 변경됐을 수 있습니다."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Heartbeat 커밋 (GitHub 60일 스케줄 자동비활성 방지, 주 1회)
        run: |
          # 파일 내용을 ISO 주차로 기록 → 같은 주 동안은 내용 불변 → 주당 1커밋만 발생.
          mkdir -p .github
          echo "last keep-alive week: $(date -u +%G-W%V)" > .github/keepalive-heartbeat.txt
          if git diff --quiet .github/keepalive-heartbeat.txt; then
            echo "이번 주 heartbeat 이미 기록됨 — 커밋 생략."
            exit 0
          fi
          git config user.name "214 keepalive bot"
          git config user.email "214-keepalive-bot@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore: supabase keepalive heartbeat [skip ci]"
          git push origin HEAD:main
