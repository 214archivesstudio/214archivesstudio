<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>214 Archives Admin — UI Mockup</title>
  <link rel="icon" href="../assets/favicon-32x32.png" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    html, body { background: #0d0d0d; margin: 0; }
    body { font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", sans-serif; }
    button:focus { outline: none; }
    button:focus-visible { outline: 1px solid rgba(255,255,255,0.4); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="admin-data.js"></script>
  <script type="text/babel" src="admin-chrome.jsx"></script>
  <script type="text/babel" src="admin-screen-login.jsx"></script>
  <script type="text/babel" src="admin-screen-dashboard.jsx"></script>
  <script type="text/babel" src="admin-screen-posts.jsx"></script>
  <script type="text/babel" src="admin-screen-new.jsx"></script>
  <script type="text/babel" src="admin-screen-edit.jsx"></script>
  <script type="text/babel" src="admin-screen-team.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const Canvas = () => (
      <DesignCanvas
        title="214 Archives Studio — Admin"
        subtitle="공개 사이트와 통일된 cinematic minimal 어드민 — 6개 화면"
      >
        <DCSection id="entry" title="진입">
          <DCArtboard id="login" label="01 · /admin/login" width={1440} height={900}>
            <LoginScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="overview" title="대시보드">
          <DCArtboard id="dashboard" label="02 · /admin" width={1440} height={1200}>
            <DashboardScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="posts" title="포스트 관리">
          <DCArtboard id="posts-list" label="03 · /admin/posts" width={1440} height={1400}>
            <PostsScreen />
          </DCArtboard>
          <DCArtboard id="posts-new" label="04 · /admin/posts/new" width={1440} height={1300}>
            <NewPostScreen />
          </DCArtboard>
          <DCArtboard id="posts-edit" label="05 · /admin/posts/[id]" width={1440} height={1450}>
            <EditPostScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="team" title="설정">
          <DCArtboard id="team" label="06 · /admin/team (선택)" width={1440} height={1000}>
            <TeamScreen />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
    ReactDOM.createRoot(document.getElementById("root")).render(<Canvas />);
  </script>
</body>
</html>
